<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <header style="text-align: center;">
        <h1>Portal Turistico</h1>
        <hr>
        <nav>
            <a href="index.html" style="margin-right: 30px;">INICIO</a>
            <a href="destinos.html" style="margin-right: 30px;">DESTINOS</a>
            <a href="favoritos.html" style="margin-right: 30px;">FAVORITOS</a>
            <a href="nosotros.html" style="margin-right: 30px;">NOSOTROS</a>
        </nav>
        <hr>
    </header>
    
    <main>
    <form action="/procesar" method="get">
      <fieldset>
        <legend>Formulario de Destino </legend>
        <label for="nombre">nombre:</label>
        <input type="text" id="Nombre" placeholder="Escribe tu Nombre" maxlength="40" required>
 
        <label for="correo">correo electronico</label>
        <input type="mail" id="correo" name="correo" placeholder="juan.perez@gmail.com" required>

         <label for="numero">numero de telefono</label>
          <input type="number" id="number" required> 

          <label for="hora">Selecciona Fecha y Hora Viaje</label>
             <input type="datetime-local" id="hora" required>

              <legend>Destino de Interes</legend>
               <input type="checkbox" id="santa Ana" required>
               <label for="santa Ana" >Santa Ana</label>

               <input type="checkbox" id="Lago de Coatepeque" required>
               <label for="Lago de Coatepeque" >Lago de Coatepeque</label>
             
              
                
         
          <label for="tipo viaje">Tipo de Viaje</label>
        <select id="viaje" name="viaje">
        <option value="a pie">A pie</option>
          <option value="Vehiculo">Carro</option>
          <option value="bus">Transporte Publico</option>
        </select>
         
        
        <label for="mensaj">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="1" cols="40" required></textarea>
          <!-- funcion de guardar no funciona debe hacer la accion -->
          <button type="submit">Guardar</button>
          <button type="reset">Limpiar</button>
      </fieldset>
    </form>


    <footer>
      <p>&copy; 2026 Portal Turistico Todos los derechos reservados El salvador.</p>
    </footer>

</body>
</html>
